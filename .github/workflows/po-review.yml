name: Validate translation catalogs

on:
  pull_request:
    paths:
      - "**/*.po"
      - "**/*.pot"

concurrency:
  group: po-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
      - name: Check catalogs
        run: |
          for catalog in ask_esafe_ai/locale/*.po ask_esafe_ai/locale/*.pot; do
            msgfmt --check-format --output-file=/dev/null "$catalog"
          done
